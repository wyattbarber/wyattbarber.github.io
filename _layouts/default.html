<script>
  document.addEventListener("DOMContentLoaded", function () {
    const headings = document.querySelectorAll("h2[id], h3[id], h4[id]");
    headings.forEach(function (heading) {
      const link = document.createElement("a");
      link.className = "header-anchor";
      link.href = "#" + heading.id;
      link.innerHTML = "🔗"; // You can replace this with an SVG icon string
      link.style.marginLeft = "8px";
      link.style.visibility = "hidden";
      
      // Provide hover behavior
      heading.appendChild(link);
      heading.addEventListener("mouseenter", () => link.style.visibility = "visible");
      heading.addEventListener("mouseleave", () => link.style.visibility = "hidden");
    });
  });
</script>
